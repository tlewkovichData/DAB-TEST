# The main pipeline for TestBundle

resources:
  pipelines:
    TestBundle_etl:
      name: TestBundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/TestBundle_etl"

      libraries:
        - glob:
            include: ../src/TestBundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
