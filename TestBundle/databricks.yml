# This is a Declarative Automation Bundle definition for TestBundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: TestBundle
  uuid: 9f1463e7-a0c9-4c8d-9b39-af0179bb4a03

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-4tqt2x.cloud.databricks.com
    variables:
      catalog: serverless_stable_4tqt2x_catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://fevm-serverless-stable-4tqt2x.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/tyler.lewkovich@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/tyler.lewkovich@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: serverless_stable_4tqt2x_catalog
      schema: prod
    permissions:
      - user_name: tyler.lewkovich@databricks.com
        level: CAN_MANAGE
